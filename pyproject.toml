[project]
name = "wordle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.62.0",
    "rich>=15.0.0",
]

[project.scripts]
wordle = "wordle.cli:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Long lines are left to `ruff format` (it can't wrap strings such as the JS snippet in client.py).
ignore = ["E501"]
